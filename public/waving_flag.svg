<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-10 -10 310 180"
  width="300"
  height="160"
>
  <defs>
    <style>
      .square {
        width: 20px;
        height: 20px;
        transform-origin: center center;
        animation: wave 2s ease-in-out infinite;
      }

      @keyframes wave {
        0%, 100% { transform: translateY(0) skewX(0deg); }
        25% { transform: translateY(-6px) skewX(-10deg); }
        50% { transform: translateY(-10px) skewX(0deg); }
        75% { transform: translateY(-6px) skewX(10deg); }
      }
    </style>
  </defs>

  <!-- 8 rows x 15 columns -->
  <!-- Checkerboard pattern: alternate fill and offset each row -->

  <!-- Row 0 -->
  <g>
    <rect x="0"   y="10"  class="square" fill="black" style="animation-delay:0s"/>
    <rect x="20"  y="10"  class="square" fill="white" style="animation-delay:0.05s"/>
    <rect x="40"  y="10"  class="square" fill="black" style="animation-delay:0.1s"/>
    <rect x="60"  y="10"  class="square" fill="white" style="animation-delay:0.15s"/>
    <rect x="80"  y="10"  class="square" fill="black" style="animation-delay:0.2s"/>
    <rect x="100" y="10"  class="square" fill="white" style="animation-delay:0.25s"/>
    <rect x="120" y="10"  class="square" fill="black" style="animation-delay:0.3s"/>
    <rect x="140" y="10"  class="square" fill="white" style="animation-delay:0.35s"/>
    <rect x="160" y="10"  class="square" fill="black" style="animation-delay:0.4s"/>
    <rect x="180" y="10"  class="square" fill="white" style="animation-delay:0.45s"/>
    <rect x="200" y="10"  class="square" fill="black" style="animation-delay:0.5s"/>
    <rect x="220" y="10"  class="square" fill="white" style="animation-delay:0.55s"/>
    <rect x="240" y="10"  class="square" fill="black" style="animation-delay:0.6s"/>
    <rect x="260" y="10"  class="square" fill="white" style="animation-delay:0.65s"/>
    <rect x="280" y="10"  class="square" fill="black" style="animation-delay:0.7s"/>
  </g>

  <!-- Row 1 (offset pattern) -->
