    <rect x="0"   y="30"  class="square" fill="white" style="animation-delay:0.03s"/>
    <rect x="20"  y="30"  class="square" fill="black" style="animation-delay:0.08s"/>
    <rect x="40"  y="30"  class="square" fill="white" style="animation-delay:0.13s"/>
    <rect x="60"  y="30"  class="square" fill="black" style="animation-delay:0.18s"/>
    <rect x="80"  y="30"  class="square" fill="white" style="animation-delay:0.23s"/>
    <rect x="100" y="30"  class="square" fill="black" style="animation-delay:0.28s"/>
